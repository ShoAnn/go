services:
  db:
    image: postgres:18.1-alpine3.22
    container_name: postgres_db_todolist_api
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_EXTERNAL_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: adminer_ui_todolist_api
    restart: always
    ports:
      - "${ADMINER_EXTERNAL_PORT}:8080"
    depends_on:
      - db

  api:
    image: golang:1.25.7-alpine
    container_name: go_todolist_api
    restart: always
    working_dir: /app
    volumes:
      - .:/app
      - go_modules:/go/pkg/mod
    command: sh -c "go mod tidy && go run cmd/api/main.go"
    ports:
      - "${API_EXTERNAL_PORT}:8080"
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      API_EXTERNAL_PORT: "8080"
    depends_on:
      - db

volumes:
  postgres_data:
  go_modules:
